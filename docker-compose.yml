services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: smart-anchor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smart_anchor
      POSTGRES_PASSWORD: smart_anchor
      POSTGRES_DB: smart_anchor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smart-anchor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
